name: Build internal SteamPrefill image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - SteamPrefill/**
      - LancachePrefill.Common
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - Dockerfile.gitea
      - .dockerignore
      - .gitea/workflows/build-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, k3s, linux, amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Log in to Gitea container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: git.nicholstech.org
          username: admin
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push SteamPrefill image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.gitea
          push: true
          tags: |
            git.nicholstech.org/nichols-homelab/steam-lancache-prefill:${{ github.sha }}
            git.nicholstech.org/nichols-homelab/steam-lancache-prefill:latest
          provenance: false
